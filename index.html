<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        /* Reset and canvas layout configuration setup */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        .video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        
        video {
            width: 100%; height: 100%;
            object-fit: cover; 
            object-position: center;
        }

        /* Desktop vs Mobile smart display switches */
        .desktop-video { display: block; }
        .mobile-video { display: none; }

        /* Trigger conditions for mobile devices and narrow screens */
        @media (max-width: 768px) {
            .desktop-video { display: none; }
            .mobile-video { display: block; }
        }

        /* Compact Square Glassmorphism Audio Button (Top Right Floating) */
        .audio-toggle {
            position: fixed;
            top: 25px;    
            right: 25px;  
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: rgba(25, 25, 25, 0.55); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            border: none; 
            outline: none;
            border-radius: 6px; 
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .audio-toggle svg {
            width: 18px;
            height: 18px;
            fill: #ffffff; 
            transition: fill 0.3s ease;
        }

        .audio-toggle:hover {
            background: rgba(25, 25, 25, 0.8); 
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Default landscape video engine for larger desktop screens -->
        <video id="desktopVid" class="desktop-video" autoplay loop muted playsinline>
            <source src="glitchd-coming-soon-variation-3.mp4" type="video/mp4">
        </video>
        
        <!-- Smart responsive portrait video switcher targeted for mobile layouts -->
        <video id="mobileVid" class="mobile-video" autoplay loop muted playsinline>
            <source src="glitchd-mobile.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Icon-Only Interactive Square Audio Button Toggle -->
    <button id="audioBtn" class="audio-toggle" aria-label="Toggle Audio">
        <svg id="audioIcon" viewBox="0 0 24 24">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
    </button>

    <script>
        const desktopVid = document.getElementById('desktopVid');
        const mobileVid = document.getElementById('mobileVid');
        const button = document.getElementById('audioBtn');
        const icon = document.getElementById('audioIcon');

        const iconVolumeMuted = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
        const iconVolumeOn = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM3 9v6h4l5 5V4L7 9H3z"/>';

        button.addEventListener('click', function() {
            // Checks which video is actively displaying right now to switch the correct track
            const activeVideo = window.getComputedStyle(mobileVid).display === 'block' ? mobileVid : desktopVid;
            
            if (activeVideo.muted) {
                activeVideo.muted = false;
                icon.innerHTML = iconVolumeOn;
            } else {
                activeVideo.muted = true;
                icon.innerHTML = iconVolumeMuted;
            }
        });
    </script>

</body>
</html>

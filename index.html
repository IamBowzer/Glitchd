<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        /* Reset and canvas styling */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        
        .video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }
        
        video {
            width: 100%; height: 100%;
            object-fit: cover; 
        }

        /* Retro Unmute Button Styling */
        .audio-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.75);
            color: #00ffcc; /* Retro neon cyan color */
            border: 2px solid #00ffcc;
            padding: 12px 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 10px #00ffcc;
            transition: all 0.3s ease;
        }

        .audio-toggle:hover {
            background-color: #00ffcc;
            color: #000;
            box-shadow: 0 0 20px #00ffcc;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- The video must start muted so browsers allow it to autoplay safely -->
        <video id="retroVideo" autoplay loop muted playsinline>
            <source src="glitchd-coming-soon-variation-3.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- The interactive retro audio toggle -->
    <button id="audioBtn" class="audio-toggle">🔊 UNMUTE AUDIO</button>

    <script>
        const video = document.getElementById('retroVideo');
        const button = document.getElementById('audioBtn');

        button.addEventListener('click', function() {
            if (video.muted) {
                video.muted = false;
                button.innerHTML = "🔇 MUTE AUDIO";
            } else {
                video.muted = true;
                button.innerHTML = "🔊 UNMUTE AUDIO";
            }
        });
    </script>

</body>
</html>
